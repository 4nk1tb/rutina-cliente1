<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#171916">
  <meta name="description" content="Tu rutina, tus entrenamientos y tu progreso. Registra cada serie y comparte lo que has conseguido.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="repite-icon-180.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="motion.css">
  <title>Repite · Tu entrenamiento, a tu ritmo</title>
</head>
<body>
  <a class="skip-link" href="#app">Ir al contenido</a>
  <header class="app-header">
    <div class="header-inner">
      <button class="brand" data-route="train" aria-label="Repite, ir al entrenamiento">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 7h12a6 6 0 0 1 6 6v6M22 25H10a6 6 0 0 1-6-6v-6M23 15l5 5 3-5M9 17l-5-5-3 5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>repite<span class="brand-dot">.</span></span>
      </button>
      <nav class="desktop-nav" aria-label="Navegación principal">
        <button data-route="train" class="active">Entrenar</button><button data-route="progress">Progreso</button><button data-route="history">Historial</button><button data-route="routine">Rutina</button>
      </nav>
      <div class="header-controls"><button class="icon-btn" id="theme-toggle" aria-label="Cambiar tema"></button><button class="profile-button" data-route="settings" aria-label="Perfil y ajustes"><span id="profile-initial">Tú</span></button></div>
    </div>
  </header>
  <main id="app" class="main" tabindex="-1">
    <section id="train-page" class="page active" aria-label="Entrenamiento"></section>
    <section id="progress-page" class="page" aria-label="Progreso" hidden></section>
    <section id="history-page" class="page" aria-label="Historial" hidden></section>
    <section id="routine-page" class="page" aria-label="Editor de rutina" hidden></section>
    <section id="settings-page" class="page" aria-label="Perfil y ajustes" hidden></section>
  </main>
  <aside id="rest-timer" class="timer-dock" hidden aria-label="Temporizador de descanso">
    <div class="timer-ring" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20"/><circle id="timer-ring-progress" cx="24" cy="24" r="20"/></svg></div>
    <div class="timer-text"><span id="timer-label">Descanso</span><strong id="timer-value" role="timer" aria-live="off">01:30</strong></div>
    <button class="btn subtle" id="timer-add" aria-label="Añadir 30 segundos">+30 s</button><button class="icon-btn" id="timer-skip" aria-label="Terminar descanso"></button>
  </aside>
  <nav class="bottom-nav" aria-label="Navegación móvil">
    <button data-route="train" class="active"><span data-icon="dumbbell"></span><span>Entrenar</span></button>
    <button data-route="progress"><span data-icon="chart"></span><span>Progreso</span></button>
    <button data-route="history"><span data-icon="calendar"></span><span>Historial</span></button>
    <button data-route="routine"><span data-icon="list"></span><span>Rutina</span></button>
    <button data-route="settings"><span data-icon="user"></span><span>Perfil</span></button>
  </nav>
  <dialog id="app-dialog" class="app-dialog" aria-labelledby="dialog-title">
    <div class="dialog-header"><div><p class="eyebrow" id="dialog-label"></p><h2 id="dialog-title"></h2></div><button id="dialog-close" class="icon-btn" aria-label="Cerrar"></button></div>
    <div id="dialog-body"></div><div id="dialog-footer" class="dialog-footer"></div>
  </dialog>
  <dialog id="share-dialog" class="share-dialog" aria-labelledby="share-title">
    <div class="dialog-header"><div><p class="eyebrow">Llévatelo contigo</p><h2 id="share-title">Tu entrenamiento, para compartir.</h2></div><button id="share-close" class="icon-btn" aria-label="Cerrar editor de imagen"></button></div>
    <div class="share-layout">
      <div class="share-preview"><canvas id="share-canvas" aria-label="Vista previa de la imagen de entrenamiento"></canvas></div>
      <div class="share-controls">
        <label class="field">Contenido<select id="share-type"><option value="session">Resumen del entrenamiento</option><option value="record">Carga destacada</option><option value="week">Constancia semanal</option></select></label>
        <label class="field">Fondo<select id="share-style"><option value="transparent">Sin fondo · PNG transparente</option><option value="card">Tarjeta redondeada</option><option value="photo">Mi foto</option></select></label>
        <label class="field">Formato<select id="share-format"><option value="sticker">Sticker</option><option value="story">Historia · 9:16</option><option value="square">Cuadrado · 1:1</option></select></label>
        <label class="field">Color del texto<select id="share-theme"><option value="dark">Claro · para fotos oscuras</option><option value="light">Oscuro · para fotos claras</option></select></label>
        <label class="field">Tu @usuario<input id="share-handle" type="text" maxlength="60" placeholder="@tuusuario" autocapitalize="none" spellcheck="false"></label>
        <label class="btn secondary photo-picker"><span data-icon="image"></span>Elegir foto (opcional)<input type="file" id="share-photo" accept="image/*" hidden></label>
        <p class="caption" id="share-photo-status">La foto se procesa en tu dispositivo.</p>
        <div class="share-actions"><button class="btn primary" id="share-native">Compartir imagen</button><button class="btn secondary" id="share-download">Guardar PNG</button><button class="btn subtle" id="share-copy">Copiar PNG</button></div>
        <p class="caption" id="share-status" role="status">Puedes colocar el PNG sobre una foto en tus historias.</p>
      </div>
    </div>
  </dialog>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
